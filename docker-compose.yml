version: '3.8'

services:
  # FastAPI Application
  fastapi:
    build: .
    container_name: fastapi_app
    restart: always
    # Exposing the port is optional here because nginx routes to it internally,
    # but useful if you want to connect directly to the container for debugging.
    expose:
      - "8000"
    volumes:
      - .:/app # Mount local directory for hot reloading if needed
    environment:
      - ENV=production

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "8000:80" # Maps port 80 of the host to port 80 of the container
      # - "443:443" # Uncomment if SSL is configured
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
